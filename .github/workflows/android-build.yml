name: Android Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JavaScript and React Native dependencies
        run: npm install --legacy-peer-deps
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
      - name: Generate Gradle wrapper
        # Run gradle wrapper in an empty temp directory so it has no project
        # build scripts to evaluate — avoids the chicken-and-egg where
        # generating the wrapper requires the RN Gradle plugin to already
        # be loadable, which in turn requires the wrapper to exist first.
        run: |
          mkdir -p /tmp/gradle-init
          cd /tmp/gradle-init
          gradle init
          gradle wrapper --gradle-version 8.8
          mkdir -p $GITHUB_WORKSPACE/android/gradle/wrapper
          cp gradlew             $GITHUB_WORKSPACE/android/gradlew
          cp gradlew.bat         $GITHUB_WORKSPACE/android/gradlew.bat
          cp gradle/wrapper/gradle-wrapper.jar        $GITHUB_WORKSPACE/android/gradle/wrapper/
          cp gradle/wrapper/gradle-wrapper.properties $GITHUB_WORKSPACE/android/gradle/wrapper/
          chmod +x $GITHUB_WORKSPACE/android/gradlew
      - name: Bundle JavaScript (Debug)
        run: |
          mkdir -p android/app/src/main/assets
          node_modules/.bin/react-native bundle \
            --platform android \
            --dev true \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      - name: Build Android (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forgelink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Bundle JavaScript (Release)
        run: |
          mkdir -p android/app/src/main/assets
          node_modules/.bin/react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      - name: Build Android (Release)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forgelink-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
