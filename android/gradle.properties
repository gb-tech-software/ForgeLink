android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# react-native-reanimated's own build.gradle requests NDK 26, which hard-errors
# on its internal minSdkVersion 16 C++ config. Suppress to restore warning-only
# behaviour (the actual app minSdk is 24, so there is no real risk here).
android.ndk.suppressMinSdkVersionError=21

