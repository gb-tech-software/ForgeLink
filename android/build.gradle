buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

// Replaces: apply plugin: "com.facebook.react.rootproject"
// ReactRootProjectPlugin only does this — make each non-app subproject
// evaluate after :app so it can read :app's properties.
subprojects {
    if (it.path != ':app') {
        evaluationDependsOn(':app')
    }
}

// ReactPlugin normally does two things we must replicate manually:
//
// 1. Registers node_modules/react-native/android as a local Maven repo.
//    This is where react-android and hermes-android are published as Maven
//    artifacts by the RN npm package itself.
//
// 2. Injects dependency substitution rules so that:
//    a) Old-style "com.facebook.react:react-native:+" (used by gesture-handler,
//       webview, etc.) is remapped to the current react-android artifact.
//    b) react-native-reanimated requests react-android and hermes-android with
//       an empty version (its reactNativeVersion ext property is unset without
//       the plugin). Substitution rules pin these to 0.76.0 so Gradle can
//       resolve them against the local Maven repo.
allprojects {
    repositories {
        maven { url "$rootDir/../node_modules/react-native/android" }
    }
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            // Old packages that still reference the retired react-native artifact
            substitute module('com.facebook.react:react-native') using module('com.facebook.react:react-android:0.76.0')
            // reanimated references these directly; pin them so an empty/dynamic
            // version request resolves to the copy in the local Maven repo
            substitute module('com.facebook.react:react-android') using module('com.facebook.react:react-android:0.76.0')
            substitute module('com.facebook.react:hermes-android') using module('com.facebook.react:hermes-android:0.76.0')
        }
    }
}
