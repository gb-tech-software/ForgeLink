apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Required by react-native-reanimated's build.gradle, which reads
// appProject.hermesEnabled to decide whether to link Hermes or JSC.
// This was previously set by ReactPlugin; we set it manually since we
// removed that plugin.
ext.hermesEnabled = true

android {
    namespace 'com.forgelink'
    compileSdkVersion 35
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId 'com.forgelink'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'
        
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.6.0'
    implementation 'androidx.work:work-runtime-ktx:2.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // React Native
    implementation 'com.facebook.react:react-android:0.76.0'
    implementation 'com.facebook.react:hermes-android:0.76.0'

    // npm packages with native Android modules (manually linked — no ReactPlugin)
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-reanimated')
    implementation project(':react-native-webview')

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
