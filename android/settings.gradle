pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS (not FAIL_ON_PROJECT_REPOS) so that npm packages that
    // declare their own google()/mavenCentral() blocks don't fail the build.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url "$rootDir/../node_modules/react-native/android" }
        maven { url "$rootDir/../node_modules/jsc-android/dist" }
    }
}

rootProject.name = 'ForgeLink'
include ':app'

// npm packages with Android native modules — manually linked because we
// removed ReactPlugin (com.facebook.react) to avoid its Kotlin source
// compilation at configure time.
include ':react-native-gesture-handler'
project(':react-native-gesture-handler').projectDir =
    new File(rootProject.projectDir, '../node_modules/react-native-gesture-handler/android')

include ':react-native-reanimated'
project(':react-native-reanimated').projectDir =
    new File(rootProject.projectDir, '../node_modules/react-native-reanimated/android')

include ':react-native-webview'
project(':react-native-webview').projectDir =
    new File(rootProject.projectDir, '../node_modules/react-native-webview/android')
